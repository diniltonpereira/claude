<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carbono Público</title>
  <meta name="description" content="Gestão, aferição, moderação e compensação de carbono para órgãos públicos, PPPs e concessões.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="pular" href="#conteudo">Ir para o conteúdo</a>
  <header class="topo">
    <a class="marca" href="#/inicio">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <path d="M16 7v18M9 13c3 0 7 2 7 6M23 11c-3 0-7 2-7 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span>Carbono Público</span>
    </a>
    <div id="sessao" class="sessao"></div>
  </header>
  <div class="moldura">
    <nav id="menu" class="menu" aria-label="Seções"></nav>
    <main id="conteudo" class="conteudo" tabindex="-1"></main>
  </div>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
  <dialog id="confirmacao" class="confirmacao">
    <form method="dialog">
      <h2 id="confirmacao-titulo"></h2>
      <p id="confirmacao-texto"></p>
      <div class="acoes">
        <button value="nao" class="botao secundario">Voltar</button>
        <button value="sim" id="confirmacao-sim" class="botao perigo"></button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
