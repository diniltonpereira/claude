legenda: |
  É a crença de que o profissional competente não precisa de ninguém.
  
  Parece virtude. Na prática, esgota quem a carrega e enfraquece quem está ao redor.
  
  No capítulo 3 de Conexões que Transformam: A arte das relações humanas no mundo profissional — Vencendo a síndrome da autossuficiência, essa crença ganha nome, sinais e um autoteste.
  
  Pré-venda aberta no Kindle; lançamento em 12/11. Link na bio (diniltonpereira.com.br/livros).
