legenda: 'Água, esgoto, lixo e drenagem: tudo isso tem regras, metas, preço e responsáveis. Desde a Lei nº 14.026/2020, essas regras mudaram, e os efeitos chegam à conta de cada família.


  Meu novo livro, Novo Marco Legal do Saneamento e seus impactos na vida dos cidadãos, une o direito, a teoria econômica da regulação e dados reais do Norte de Minas.


  Pré-venda do eBook na Amazon, lançamento em 21/12. Link na bio: diniltonpereira.com.br/livros (ou busque "Novo Marco Legal do Saneamento" na Amazon).

