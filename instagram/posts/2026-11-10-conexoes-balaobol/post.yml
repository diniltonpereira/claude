legenda: |
  Pedi a dois grupos que marcassem o maior número de pontos possível. Eles passaram a atrapalhar um ao outro.
  
  Ninguém tinha mandado competir. A competição estava só na cabeça deles.
  
  O Balãobol é uma das dinâmicas reais do livro Conexões que Transformam: A arte das relações humanas no mundo profissional — Vencendo a síndrome da autossuficiência, com roteiro pronto para aplicar na sua equipe (capítulo 13).
  
  Pré-venda aberta no Kindle; lançamento em 12/11. Link na bio (diniltonpereira.com.br/livros).
