legenda: |
  Num intervalo, cada um serviu o lanche do colega. Muitos descobriram que não sabiam do que o outro gostava. E alguns, pela primeira vez, pediram o que realmente queriam.
  
  Empatia é colocar-se no lugar do outro para servi-lo melhor.
  
  O exercício completo está no capítulo 12 de Conexões que Transformam: A arte das relações humanas no mundo profissional — Vencendo a síndrome da autossuficiência.
  
  Disponível no Kindle. Link na bio (diniltonpereira.com.br/livros).
