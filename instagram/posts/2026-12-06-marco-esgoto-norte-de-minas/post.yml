legenda: '33 municípios do Norte de Minas não têm nenhuma informação sobre esgoto no SINISA 2023. Entre os que têm, a mediana de atendimento com coleta e tratamento é de 39,3%, e nenhum alcança a meta de 90% para 2033 (p. 155).


  Sem dados, não há como regular. Esse é um dos temas dos capítulos 21 e 22 do livro Novo Marco Legal do Saneamento.


  Impresso já disponível no Clube de Autores. eBook em pré-venda na Amazon, lançamento em 21/12. Link na bio.

