legenda: 'A Lei nº 14.026/2020 tornou obrigatória a cobrança pelo manejo de resíduos sólidos. Ainda assim, muitos municípios não instituíram a taxa. O motivo quase sempre é o medo do custo eleitoral.


  No capítulo 22 do livro Novo Marco Legal do Saneamento, reuni 8 estratégias para viabilizar a cobrança (Quadro 22.1, p. 160). Quando o cidadão sabe quanto o serviço custa e quem paga hoje, a taxa deixa de parecer imposto novo.


  Pré-venda na Amazon, lançamento em 21/12. Link na bio.

