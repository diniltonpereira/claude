legenda: |
  Tem livro que a gente quer ler no papel, sublinhar e emprestar. Conexões que Transformam: a arte das relações humanas no mundo profissional agora também está em versão impressa.

  São 16 capítulos, e cada um termina com um exercício prático, um resumo e perguntas de autoavaliação. A leitura informa; a prática transforma.

