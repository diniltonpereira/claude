legenda: |
  Ao estudar equipes de enfermagem, a pesquisadora Amy Edmondson esperava que as melhores errassem menos. Elas registravam mais erros: não porque erravam mais, mas porque não tinham medo de contar.
  
  Equipes seguras não erram menos. Escondem menos os erros.
  
  Na sua equipe, é seguro dizer "errei"? Capítulo 14 de Conexões que Transformam: A arte das relações humanas no mundo profissional — Vencendo a síndrome da autossuficiência.
  
