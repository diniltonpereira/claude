etiqueta: Faltam 7 dias
livro: Conexões que Transformam
capa:
  titulo: Para algumas pessoas, os princípios são uma medalha de prateleira
  subtitulo: Ficam expostos, bem polidos, mas nunca são usados.
slides:
- chamada: A CENA
  titulo: Uma reunião fechada
  texto: Emília passou semanas preparando uma proposta. Não passou do terceiro slide.
- chamada: A FRASE
  titulo: '"Deixa que as decisões a gente toma aqui"'
  texto: Disse o homem mais graduado da mesa, sem olhar para ela. Alguns riram. Emília recolheu os papéis e não falou mais.
- chamada: O CONTRASTE
  titulo: Em público, ele falava de respeito
  texto: Conhecia os princípios. Provavelmente acreditava neles. Mas, a portas fechadas, os princípios não compareciam.
- chamada: A LIÇÃO
  titulo: Caráter é o que você faz com o seu poder
  texto: Quando ninguém que importa para você está olhando.
- chamada: A PERGUNTA
  titulo: Qual é a sua medalha de prateleira?
  texto: Todos temos algum valor que defendemos em público e esquecemos quando estamos cansados ou pressionados.
fechamento:
  titulo: É assim que o livro começa
  texto: Com uma cena real, com nomes alterados, e um padrão que se repete em qualquer organização.
