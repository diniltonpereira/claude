etiqueta: Novo livro · 12/11
livro: Conexões que Transformam
capa:
  imagem: ../../ferramentas/capas/conexoes-que-transformam.jpg
  titulo: Novo livro chega em 12 de novembro
  subtitulo: Vencendo a síndrome da autossuficiência
slides:
- chamada: A PERGUNTA
  titulo: Por que profissionais brilhantes perdem a confiança da equipe?
  texto: Quase nunca é falta de conhecimento. As pessoas fracassam porque não conseguem conviver.
- chamada: A TESE
  titulo: A síndrome da autossuficiência
  texto: A crença de que o profissional competente é aquele que não precisa de ninguém. Uma metáfora, não um diagnóstico clínico.
- chamada: A ORIGEM
  titulo: Nasceu de um curso para 120 lideranças
  texto: Supervisores, gerentes e coordenadores de uma grande instituição de saúde. Muitas das melhores ideias vieram das conversas daquelas turmas.
- chamada: O QUE VOCÊ ENCONTRA
  titulo: 16 capítulos em 4 partes
  texto: O mundo de dentro, o encontro, o poder e o serviço, o nós. Com autoteste, exercícios e perguntas de reflexão.
fechamento:
  titulo: Pré-venda aberta no Kindle
  texto: Lançamento em 12 de novembro. O link está na bio.
