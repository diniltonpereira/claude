legenda: |
  Vi profissionais tecnicamente impecáveis perderem a confiança de toda uma equipe em poucos meses. E equipes modestas realizarem coisas notáveis porque confiavam umas nas outras.

  Desse contraste nasceu Conexões que Transformam: a arte das relações humanas no mundo profissional.

  Pré-venda do eBook na Amazon, lançamento em 12/11. Link na bio: diniltonpereira.com.br/livros (ou busque "Conexões que Transformam" na Amazon).
