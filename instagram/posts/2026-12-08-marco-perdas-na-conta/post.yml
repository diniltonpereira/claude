legenda: 'Um prestador de água pode parecer eficiente e, mesmo assim, perder uma parte enorme da água que produz.


  Na Parte V do livro Novo Marco Legal do Saneamento, mostro com Análise Envoltória de Dados (DEA) o que acontece quando as perdas entram na conta: em 84 municípios do Norte de Minas, a correlação entre eficiência e perdas vai de 0,06 para −0,40 (p. 152). A escolha dos indicadores muda o diagnóstico.


  Pré-venda na Amazon, lançamento em 21/12. Link na bio.

