legenda: |
  Hoje em Goiânia, na Federação Goiana de Municípios (FGM), tive a honra de falar sobre Consórcios Públicos na Assembleia Geral Extraordinária do CIABC/GO.

  O tema: "Mais escala, mais técnica, mais voz para os Municípios". Apresentamos os novos instrumentos de atuação do consórcio previstos no Protocolo de Intenções (Cláusulas 13 a 17).

  Muitos municípios brasileiros não têm, sozinhos, estrutura para regular, licenciar, comprar bem ou executar políticas públicas complexas. O consórcio público é a ferramenta que transforma essa fragilidade em força coletiva.

  🔹 Escala: compras e serviços compartilhados, com mais eficiência
  🔹 Técnica: equipes qualificadas a serviço de todos os consorciados
  🔹 Voz: municípios articulados e mais fortes na defesa dos seus interesses

  Agradeço à FGM e ao CIABC/GO pelo convite e pela confiança. Municipalismo se faz com cooperação! 🤝
