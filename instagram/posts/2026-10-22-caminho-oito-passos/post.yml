legenda: |
  Quase todos nós carregamos algo que gostaríamos de deixar para trás: uma mágoa antiga, um hábito que volta, um relacionamento que ainda dói.

  "Caminho da Restauração" organiza esse processo em 8 passos, cada um ligado a uma das Bem-aventuranças de Jesus. Não é teoria nem fórmula mágica: é um caminho bíblico e prático, para percorrer um passo de cada vez, sozinho ou em grupo.

  Em qual dos 8 passos você está hoje? Conte nos comentários.

