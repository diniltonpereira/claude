  titulo: 'Pré-venda aberta: lançamento em 21 de dezembro'
  subtitulo: Regulação, normas de referência e os desafios da universalização no Brasil
slides:
- chamada: A PERGUNTA
  titulo: O que a Lei nº 14.026/2020 muda na vida de quem paga a conta?
  texto: Água, esgoto, lixo e drenagem têm regras, metas, preço e responsáveis. Este livro explica cada um deles.
- chamada: PARA QUEM
  titulo: Para quem aplica o marco no dia a dia
  texto: Gestores municipais, agências reguladoras, consórcios, advogados públicos, Tribunais de Contas, Ministério Público, estudantes e pesquisadores.
- chamada: O QUE VOCÊ ENCONTRA
  titulo: 23 capítulos em 5 partes
  texto: Fundamentos, instituições da regulação, contratos e investimento, o serviço na ponta e evidência empírica.
- chamada: O DIFERENCIAL
  titulo: Dados reais do Norte de Minas
  texto: Um estudo com Análise Envoltória de Dados (DEA), replicado em 84 municípios da região com dados do SINISA.
fechamento:
  titulo: Pré-venda aberta no Kindle
  texto: Lançamento em 21 de dezembro. O link está na bio.
