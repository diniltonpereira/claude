legenda: '31 de dezembro de 2033. É o prazo que a Lei nº 14.026/2020 fixou para o Brasil levar água potável a 99% da população e coleta e tratamento de esgoto a 90%.


  O desafio: o investimento anual precisa sair de uma média histórica de R$ 15 bilhões para algo entre R$ 35 e R$ 40 bilhões (p. 112).


  No livro Novo Marco Legal do Saneamento, o capítulo 16 analisa o que ainda trava esse avanço. Pré-venda na Amazon, lançamento em 21/12. Link na bio.

