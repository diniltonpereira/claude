name: Verificar conta do Instagram

# Roda quando instagram/verificar.txt muda (o Claude altera esse arquivo para pedir um teste)
# ou manualmente. Não publica nada: confere o token, a conta e simula a fila.
on:
  push:
    branches: [main]
    paths: ["instagram/verificar.txt"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: instagram

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: instagram/requirements.txt
      - run: pip install -r requirements.txt

      - name: Conferir token e conta
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set +e
          {
            echo "Verificação: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            echo
            python -m publisher conta 2>&1 | tail -3 | sed -E 's/IG[A-Za-z0-9_-]{20,}/[TOKEN OCULTO]/g'
            echo "Resultado conta: ${PIPESTATUS[0]}"
            echo
            python -m publisher publicar --slug 2026-10-21-checklist-do-estatuto --simular 2>&1 | head -4
            echo
            python -m publisher listar
          } > state/verificacao.txt
          cat state/verificacao.txt

      - name: Gravar resultado
        run: |
          git config user.name "publicador-instagram"
          git config user.email "publicador@users.noreply.github.com"
          git add state/verificacao.txt
          git commit -m "Resultado da verificação da conta [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
