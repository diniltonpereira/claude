name: Cerne · Deploy na VPS

# Manual (Actions > Cerne · Deploy na VPS > Run workflow).
# Segredos do repositório necessários:
#   VPS_HOST          IP ou nome da VPS
#   VPS_USER          usuário de operação (padrão do provisionamento: cerne)
#   VPS_SSH_KEY       chave privada SSH com acesso a esse usuário
#   VPS_KNOWN_HOSTS   saída de:  ssh-keyscan -p <porta> <host>
#   VPS_PORT          (opcional) porta SSH, padrão 22
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerne-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Configurar SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$KEY" && test -n "$KNOWN" || { echo "Configure VPS_SSH_KEY e VPS_KNOWN_HOSTS"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o BatchMode=yes "${USER_:-cerne}@$HOST" \
            'bash /opt/cerne/cerne/deploy/deploy.sh'
