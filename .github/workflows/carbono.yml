name: Testar plataforma de carbono

on:
  pull_request:
    paths: ["carbono/**"]
  push:
    branches: [main]
    paths: ["carbono/**"]

defaults:
  run:
    working-directory: carbono

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: carbono/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m plataforma demo --banco /tmp/demo.db
