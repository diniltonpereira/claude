name: Cerne · CI

on:
  pull_request:
    paths: ["cerne/**", ".github/workflows/cerne-*.yml"]
  push:
    branches: [main]
    paths: ["cerne/**", ".github/workflows/cerne-*.yml"]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cerne/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cerne
          POSTGRES_PASSWORD: cerne
          POSTGRES_DB: cerne_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cerne" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cerne/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Testes (SQLite)
        run: python -m pytest
      - name: Testes (Postgres, inclui concorrência na trilha)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://cerne:cerne@localhost:5432/cerne_test
        run: python -m pytest
      - name: Migrações aplicam e batem com os modelos
        env:
          DATABASE_URL: postgresql+psycopg://cerne:cerne@localhost:5432/cerne_test
        run: |
          psql "postgresql://cerne:cerne@localhost:5432/cerne_test" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head
          alembic check

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Imagem da API
        run: docker build -t cerne-api:ci cerne/api
      - name: docker compose config
        working-directory: cerne/deploy
        run: |
          cp .env.example .env
          sed -i -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=x/' -e 's/^ADMIN_TOKEN=.*/ADMIN_TOKEN=x/' \
                 -e 's/^CERNE_MASTER_KEY=.*/CERNE_MASTER_KEY=x/' .env
          docker compose config -q
          docker compose --profile sync config -q
      - name: Caddyfile
        run: |
          docker run --rm -v "$PWD/cerne/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e CERNE_DOMAIN=cerne.example.com -e ACME_EMAIL=ci@example.com -e "ADMIN_ALLOW_IPS=0.0.0.0/0" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 -S warning \
            cerne/deploy/*.sh cerne/deploy/vps/*.sh cerne/api/docker-entrypoint.sh
      - name: Painel (sintaxe JS)
        run: node --check cerne/painel/app.js && node --check cerne/painel/sw.js
