name: Validar posts e código

on:
  pull_request:
  push:
    branches: [main]
    paths: ["instagram/**"]

defaults:
  run:
    working-directory: instagram

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: instagram/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m publisher validar
      - run: python -m publisher listar
